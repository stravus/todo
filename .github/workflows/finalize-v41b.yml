name: Finalize Todo v4.1 browser gate

on:
  push:
    branches: [chatgpt/v4.1]
    paths: [.github/workflows/finalize-v41b.yml]

permissions:
  contents: write

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Reconstruct exact candidate and syntax-check
        run: |
          cat .staging/v41_01.b64 .staging/v41_02a.b64 .staging/v41_02b.b64 .staging/v41_03.b64 .staging/v41_04.b64 .staging/v41_05.b64 .staging/v41_06.b64 .staging/v41_07a.b64 .staging/v41_07b.b64 | base64 -d > index.html
          echo "3581ae3d6394c83c23a234926662a32ad8585219c0cb075da4162959147a1242  index.html" | sha256sum -c -
          test "$(wc -c < index.html)" -eq 72834
          grep -q 'const APP_VERSION="4.1.0"' index.html
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read(); m=re.findall(r'<script>(.*?)</script>',s,re.S); assert len(m)==1
          open('/tmp/app.js','w',encoding='utf-8').write(m[0])
          PY
          node --check /tmp/app.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Chromium regression and real UI flows
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep .5; done
          cat > smoke.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const self=await browser.newPage(); const selfErr=[]; self.on('pageerror',e=>selfErr.push(e.message));
              await self.goto('http://127.0.0.1:8765/?selftest=1');
              await self.waitForFunction(()=>document.documentElement.dataset.selftest==='pass',null,{timeout:30000});
              const summary=(await self.locator('#testSummary').textContent()).trim();
              assert(summary==='51/51 PASS',`selftest ${summary}`); assert(selfErr.length===0,`selftest errors ${selfErr.join(';')}`);
              console.log('SELFTEST',summary); await self.close();

              const ctx=await browser.newContext();
              const page=await ctx.newPage(); const errs=[]; page.on('pageerror',e=>errs.push(e.message));
              await page.goto('http://127.0.0.1:8765/');
              await page.evaluate(()=>localStorage.clear());
              await page.reload();

              const today=await page.evaluate(()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`});

              // Create a due-today task through the UI and also mark it Next wk.
              await page.locator('#newTitle').fill('Due today + next');
              await page.locator('#newDate').fill(today);
              await page.locator('#newPath').fill('Alpha / Beta');
              await page.locator('#newNext').click();
              await page.locator('#addBtn').click();

              // Create a second task in the exact same path.
              await page.locator('#newTitle').fill('Same path');
              await page.locator('#newPath').fill('Alpha / Beta');
              await page.locator('#addBtn').click();

              // Today regression: date wins over Next wk tag.
              await page.locator('button[data-view="today"]').click();
              await page.getByText('Due today + next',{exact:true}).waitFor({state:'visible'});
              assert(Number(await page.locator('#cToday').textContent())>=1,'Today count missing due-today + Next wk task');

              // Same-path collapse / expand.
              await page.locator('button[data-view="open"]').click();
              assert(await page.locator('.task').count()===2,'expected two tasks created through UI');
              const group=page.locator('[data-collapse]').filter({hasText:'Alpha › Beta'}).first();
              await group.waitFor({state:'visible'});
              await group.click(); assert(await page.locator('.task').count()===0,'collapse failed');
              await group.click(); assert(await page.locator('.task').count()===2,'expand failed');

              // Edit path by clicking the visible path chip.
              const todayTask=page.getByText('Due today + next',{exact:true}).locator('..').locator('..');
              await page.locator('.task').filter({hasText:'Due today + next'}).locator('.path-chip').click();
              await page.locator('#inlinePath').fill('Gamma / Delta');
              await page.locator('[data-action="inline-save"]').click();
              await page.getByText('Gamma › Delta',{exact:true}).first().waitFor({state:'visible'});

              // Create and edit a bug in backlog, mark it for implementation, generate prompt.
              await page.locator('button[data-view="history"]').click();
              await page.locator('#backlogType').selectOption('bug');
              await page.locator('#backlogTitle').fill('Test bug');
              await page.locator('#backlogAddBtn').click();
              const row=page.locator('.backlog-row').filter({has:page.locator('input[data-bfield="title"][value="Test bug"]')});
              await row.waitFor({state:'visible'});
              await row.locator('[data-bfield="description"]').fill('Bug description');
              await row.locator('[data-bfield="description"]').press('Tab');
              const refreshed=page.locator('.backlog-row').filter({has:page.locator('input[data-bfield="title"][value="Test bug"]')});
              await refreshed.locator('[data-bfield="comment"]').fill('Implement carefully');
              await refreshed.locator('[data-bfield="comment"]').press('Tab');
              const refreshed2=page.locator('.backlog-row').filter({has:page.locator('input[data-bfield="title"][value="Test bug"]')});
              await refreshed2.locator('[data-bfield="selected"]').check();
              await page.locator('#generatePromptBtn').click();
              const prompt=await page.locator('#promptBox').inputValue();
              assert(prompt.includes('[BUG] Test bug'),'prompt missing selected bug');
              assert(prompt.includes('Bug description'),'prompt missing description');
              assert(prompt.includes('Implement carefully'),'prompt missing implementation comment');

              // Add an improvement through the same backlog UI.
              await page.locator('#backlogType').selectOption('improvement');
              await page.locator('#backlogTitle').fill('Smoke improvement');
              await page.locator('#backlogAddBtn').click();
              await page.getByDisplayValue('Smoke improvement').waitFor({state:'visible'});

              assert(errs.length===0,`page errors ${errs.join(';')}`);
              console.log('UI_GATE PASS: today, next-wk interaction, collapse/expand, path edit, backlog edit, prompt generation');
              await ctx.close();
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node smoke.cjs
      - name: Finalize branch after green gates
        run: |
          cat >> TEST_LOG_v4.1.0.md <<'EOF'

          ## GitHub Actions final browser gate
          - Exact candidate SHA-256 / byte length: **PASS**
          - JavaScript syntax: **PASS**
          - Embedded regression suite in real Chromium: **51/51 PASS**
          - Local pre-publication functional/regression suite: **60/60 PASS**
          - Real UI: create task due today and also flag it `Next wk`; verify it appears in Today: **PASS**
          - Real UI: create two todos in same path and collapse / expand group: **PASS**
          - Real UI: edit path by clicking path chip: **PASS**
          - Real UI: create/edit Bug backlog item, add implementation comment, select for implementation and generate prompt: **PASS**
          - Real UI: add improvement backlog item: **PASS**
          - Browser page errors in tested flows: **0**
          - Live Dropbox write: **not performed** to protect production data; deterministic sync tests cover serialization/conflict behavior.

          **Final publication gate: PASS.**
          EOF
          git rm -r -- .staging
          git rm -- .github/workflows/finalize-v41.yml .github/workflows/finalize-v41b.yml .github/workflows/publish-v41.yml .github/workflows/diagnose-v41.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html TEST_LOG_v4.1.0.md
          git commit -m "[v41-final] Publish todo v4.1.0" -m "Passed 60/60 local tests, 51/51 embedded Chromium tests and real UI smoke tests."
          git push
