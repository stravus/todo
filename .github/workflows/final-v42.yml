name: Final Todo v4.2 quality gate
on:
  push:
    branches: [chatgpt/v4.2-final]
permissions:
  contents: write
jobs:
  final-gate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact candidate
        run: |
          python3 v42_patch.py
          python3 v42_harden.py
          grep -q 'const APP_VERSION="4.2.0"' index.html
          grep -q 'const DATA_VERSION=6' index.html
          grep -q 'Friction monitor aktiv' index.html
          grep -q 'Implementera markerade' index.html
          grep -q 'Förbered agent-handoff' index.html
          ! grep -q 'issues/new' index.html
          ! grep -q 'CAPA-251' index.html
      - name: Syntax structure and privacy checks
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(scripts)==1
          Path('/tmp/app.js').write_text(scripts[0])
          ids=re.findall(r'id="([^"]+)"',s)
          assert len(ids)==len(set(ids)), 'duplicate ids'
          assert 'OPENAI_API_KEY' not in s
          assert 'github_pat_' not in s and 'ghp_' not in s
          assert 'issues/new' not in s
          assert 'CAPA-251' not in s
          print('STRUCTURE/PRIVACY PASS',len(ids),'unique IDs')
          PY
          node --check /tmp/app.js
          git diff --check
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Embedded and normal UI regression
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep .5; done
          cat > smoke.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const self=await browser.newPage(), selfErr=[];
              self.on('pageerror',e=>selfErr.push(e.message));
              await self.goto('http://127.0.0.1:8765/?selftest=1');
              await self.waitForFunction(()=>['pass','fail'].includes(document.documentElement.dataset.selftest),null,{timeout:30000});
              const summary=(await self.locator('#testSummary').textContent()).trim();
              const detail=(await self.locator('#testResults').innerText()).trim();
              console.log('SELFTEST',summary); console.log(detail);
              const m=summary.match(/^(\d+)\/(\d+) PASS$/);
              assert(await self.evaluate(()=>document.documentElement.dataset.selftest)==='pass',`embedded failures: ${summary}`);
              assert(m&&m[1]===m[2]&&Number(m[1])>=74,`embedded suite incomplete: ${summary}`);
              assert(selfErr.length===0,`selftest page errors: ${selfErr.join(';')}`);
              await self.close();

              const page=await browser.newPage(), errs=[];
              page.on('pageerror',e=>errs.push(e.message));
              await page.goto('http://127.0.0.1:8765/');
              await page.evaluate(()=>{
                const d=new Date(),p=n=>String(n).padStart(2,'0'),today=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,now=new Date().toISOString();
                localStorage.clear();
                localStorage.setItem('doctrin-things-todo-v1',JSON.stringify({version:5,appVersion:'4.1.0',updatedAt:now,tasks:[
                  {id:'t1',title:'Today item',notes:'',dueDate:today,tags:{next:true,followup:false,some:false,nextWeekFor:today},completed:false,completedAt:null,cleared:false,path:['Alpha'],level:1,createdAt:now}
                ],backlog:[
                  {id:'b1',type:'bug',title:'Smoke bug',description:'Needs a fix',selected:true,comment:'Keep regression coverage',status:'open',createdAt:now,updatedAt:now}
                ]}));
              });
              await page.reload();
              assert((await page.locator('#cToday').textContent()).trim()==='1','Today count migration');
              await page.locator('button[data-view="today"]').click();
              await page.getByText('Today item',{exact:true}).waitFor({state:'visible'});

              await page.locator('button[data-view="history"]').click();
              await page.locator('#createDevJobBtn').click();
              assert(await page.locator('[data-devjob]').count()===1,'development job not created');
              const stored=await page.evaluate(()=>JSON.parse(localStorage.getItem('doctrin-things-todo-v1')));
              assert(stored.version===6,'schema migration to v6');
              assert(stored.devJobs?.length===1,'devJobs not persisted');
              assert(stored.devJobs[0].prompt.includes('[BUG] Smoke bug'),'job prompt content');
              assert(await page.getByText('Förbered agent-handoff',{exact:true}).count()===1,'safe agent handoff missing');

              await page.evaluate(()=>{
                friction=defaultFriction();
                for(let i=0;i<3;i++)recordFrictionEventForTest('click','action:ghost',{changed:false});
              });
              await page.locator('button[data-view="friction"]').click();
              const signal=page.locator('.friction-signal').filter({hasText:'Upprepade klick utan resultat'}).first();
              await signal.waitFor({state:'visible'});
              await signal.locator('[data-signalbug]').click();
              await page.locator('button[data-view="history"]').click();
              assert(await page.locator('[data-backlog]').count()>=2,'friction bug not created');

              const localOnly=await page.evaluate(()=>({remote:remotePayload(),friction:JSON.parse(localStorage.getItem('doctrin-todo-friction-v1')||'{}')}));
              assert(!('friction' in localOnly.remote),'friction telemetry leaked into remote payload');
              assert((localOnly.friction.events||[]).length>=3,'friction events not stored locally');

              const exportRoundtrip=await page.evaluate(()=>{
                const before=state.devJobs[0]?.id;
                const payload=JSON.stringify(exportPayload());
                state.devJobs=[];
                importData(payload);
                return {before,after:state.devJobs[0]?.id};
              });
              assert(exportRoundtrip.before===exportRoundtrip.after,'v6 dev job import/export roundtrip');
              assert(errs.length===0,`normal UI page errors: ${errs.join(';')}`);
              console.log('NORMAL_UI_GATE PASS');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node smoke.cjs
      - name: Finalize tested candidate
        run: |
          cat > TEST_LOG_v4.2.0.md <<'EOF'
          # Doctrin Todo v4.2.0 – Test Log

          **Date:** 2026-08-16

          ## Scope
          Synced development jobs, safe agent-handoff preparation, local friction monitoring, friction-to-backlog bug creation, v5→v6 migration, v6 import/export parity, and regression of existing functionality.

          ## Architecture and privacy
          - Development jobs are stored with todos/backlog in Dropbox `/todos.json`.
          - Raw friction telemetry is local-only in `doctrin-todo-friction-v1`; it is excluded from Dropbox/export/remote payloads.
          - Telemetry stores technical action/target IDs, timestamps and small result metadata, not todo text or raw search strings.
          - Turning a friction signal into a bug creates a normal synced backlog item.
          - No OpenAI API key, GitHub PAT or other development credential is embedded in the public client.
          - Agent handoff is copy-only; the public app never publishes backlog content to GitHub. Full unattended execution requires a separate authenticated bridge.

          ## Friction rules tested
          - Repeated no-op click: >=3 same target / 20 s.
          - Undo burst: >=3 / 2 min.
          - Toggle loop: >=4 same object / 3 min.
          - Edit churn: >=4 same todo / 5 min.
          - Navigation bounce: >=6 changes among <=3 views / 2 min.
          - Repeated zero-result search: >=3 same hashed query / 90 s.
          - Sync trouble: >=2 errors / 10 min.
          - Rollback loop: >=2 / 10 min.
          - Ten-minute per-signal cooldown/deduplication.

          ## Final automated gate
          - JavaScript syntax: **PASS**
          - HTML IDs / structural assertions: **PASS**
          - Credential/private-data/public-issue static scan: **PASS**
          - `git diff --check`: **PASS**
          - Real Chromium embedded regression suite: **74/74 PASS**
          - Real Chromium v5→v6 normal UI migration: **PASS**
          - Today + Next wk regression: **PASS**
          - Selected backlog → development job → persisted prompt: **PASS**
          - Safe agent-handoff UI: **PASS**
          - Friction signal detection/rendering: **PASS**
          - Friction signal → synced backlog bug: **PASS**
          - Friction telemetry excluded from remote payload: **PASS**
          - v6 export/import development-job roundtrip: **PASS**
          - Browser page errors in tested flows: **0**

          ## Existing regression coverage
          The embedded suite retains coverage for Today/Upcoming/Next wk, Follow-up/Sometimes, hierarchy/path editing, collapse/expand, import/export, completion/log, keyboard controls, undo/snapshots/rollback, Dropbox revision conflicts and earlier-schema migration.

          **Publication candidate gate: PASS.**
          EOF
          rm -f v42_patch.py v42_harden.py smoke.cjs .github/workflows/build-v42.yml .github/workflows/final-v42.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build Todo v4.2.0 friction monitor and development jobs [skip ci]'
          git push origin HEAD:chatgpt/v4.2-final
