name: Diagnose v4.1 normal load
on:
  push:
    branches: [chatgpt/v4.1]
    paths: [.github/workflows/diagnose-normal-load-v41.yml]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact candidate
        run: |
          cat .staging/v41_01.b64 .staging/v41_02a.b64 .staging/v41_02b.b64 .staging/v41_03.b64 .staging/v41_04.b64 .staging/v41_05.b64 .staging/v41_06.b64 .staging/v41_07a.b64 .staging/v41_07b.b64 | base64 -d > index.html
          echo "3581ae3d6394c83c23a234926662a32ad8585219c0cb075da4162959147a1242  index.html" | sha256sum -c -
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose add-row visibility
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep .5; done
          cat > diag.cjs <<'NODE'
          const {chromium}=require('playwright');
          const info=async(p,label)=>console.log(label,await p.evaluate(()=>{const el=document.querySelector('#newPath'),r=el?.getBoundingClientRect(),cs=el?getComputedStyle(el):null;return {view:document.querySelector('#nav button.active')?.dataset.view,addDisplay:getComputedStyle(document.querySelector('#addRow')).display,path:{exists:!!el,display:cs?.display,visibility:cs?.visibility,opacity:cs?.opacity,w:r?.width,h:r?.height,x:r?.x,y:r?.y,value:el?.value},tasks:document.querySelectorAll('.task').length,body:document.body.innerText.slice(0,900)}}));
          (async()=>{const b=await chromium.launch({headless:true});try{const p=await b.newPage();p.on('pageerror',e=>console.log('PAGEERROR',e.message));await p.goto('http://127.0.0.1:8765/');await p.evaluate(()=>localStorage.clear());await p.reload();await info(p,'BEFORE');const d=await p.evaluate(()=>{const x=new Date(),q=n=>String(n).padStart(2,'0');return `${x.getFullYear()}-${q(x.getMonth()+1)}-${q(x.getDate())}`});await p.locator('#newTitle').fill('Due today + next');await p.locator('#newDate').fill(d);await p.locator('#newPath').fill('Alpha / Beta');await p.locator('#newNext').click();await p.locator('#addBtn').click();await p.waitForTimeout(300);await info(p,'AFTER_FIRST');}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node diag.cjs
