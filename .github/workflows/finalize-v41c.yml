name: Finalize Todo v4.1 corrected render

on:
  push:
    branches: [chatgpt/v4.1]
    paths: [.github/workflows/finalize-v41c.yml]

permissions:
  contents: write

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct candidate and apply browser-found render fix
        run: |
          cat .staging/v41_01.b64 .staging/v41_02a.b64 .staging/v41_02b.b64 .staging/v41_03.b64 .staging/v41_04.b64 .staging/v41_05.b64 .staging/v41_06.b64 .staging/v41_07a.b64 .staging/v41_07b.b64 | base64 -d > index.html
          echo "3581ae3d6394c83c23a234926662a32ad8585219c0cb075da4162959147a1242  index.html" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          replacements={
            'const used=new Set(),overdue=items.filter(isOverdue);':'const used=new Set(),overdue=items.filter(t=>isOverdue(t));',
            'group("Overdue",items.filter(isOverdue),"overdue","","overdue")+group("Today",items.filter(dueToday),"",humanDate(isoDate()),"today")':'group("Overdue",items.filter(t=>isOverdue(t)),"overdue","","overdue")+group("Today",items.filter(t=>dueToday(t)),"",humanDate(isoDate()),"today")',
            'document.getElementById("cUpcoming").textContent=active.filter(isInUpcoming).length;':'document.getElementById("cUpcoming").textContent=active.filter(t=>isInUpcoming(t)).length;',
            'document.getElementById("cNext").textContent=active.filter(isDueNextWeek).length;':'document.getElementById("cNext").textContent=active.filter(t=>isDueNextWeek(t)).length;',
          }
          for old,new in replacements.items():
              assert old in s, old
              s=s.replace(old,new)
          anchor=next(line for line in s.splitlines() if 'await test("REGRESSION: Today includes' in line)
          extra='\n'.join([
            'await test("REGRESSION: Today renderer shows due-today + Next wk task",()=>{const t=normalizeTask({title:"render-today-next",dueDate:isoDate(),tags:{next:true},path:["A"]});const h=renderToday([t]);assert(h.includes("render-today-next"))});',
            'await test("REGRESSION: Upcoming renderer shows overdue task",()=>{const t=normalizeTask({title:"render-overdue",dueDate:"2020-01-01",path:["A"]});const h=renderUpcoming([t]);assert(h.includes("render-overdue"))});',
            'await test("REGRESSION: render counters count dated upcoming/next-week tasks",()=>{const t=normalizeTask({title:"counter-next",dueDate:isoDate(weekBounds().nextMonday),path:["A"]});state.tasks=[t];state.view="open";render();assert(document.getElementById("cUpcoming").textContent==="1");assert(document.getElementById("cNext").textContent==="1")});'
          ])
          s=s.replace(anchor,anchor+'\n'+extra)
          p.write_text(s)
          PY
          echo "aaf8eba5034efb19906dc10ada1e6398e7b3e129b5ffa2bd673ea1f74cb5dbbd  index.html" | sha256sum -c -
          test "$(wc -c < index.html)" -eq 73669
          grep -q 'const APP_VERSION="4.1.0"' index.html
          ! grep -q 'CAPA-251' index.html

      - name: JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read(); m=re.findall(r'<script>(.*?)</script>',s,re.S); assert len(m)==1
          open('/tmp/app.js','w',encoding='utf-8').write(m[0])
          PY
          node --check /tmp/app.js

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Chromium embedded regression and normal UI gate
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep .5; done
          cat > smoke.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const self=await browser.newPage(), selfErr=[]; self.on('pageerror',e=>selfErr.push(e.message));
              await self.goto('http://127.0.0.1:8765/?selftest=1');
              await self.waitForFunction(()=>document.documentElement.dataset.selftest==='pass',null,{timeout:30000});
              const summary=(await self.locator('#testSummary').textContent()).trim();
              assert(summary==='54/54 PASS',`embedded selftest: ${summary}`); assert(selfErr.length===0,`selftest errors: ${selfErr.join(';')}`);
              console.log('SELFTEST',summary); await self.close();

              const page=await browser.newPage(), errs=[]; page.on('pageerror',e=>errs.push(e.message));
              await page.goto('http://127.0.0.1:8765/');
              await page.evaluate(()=>{
                const d=new Date(),p=n=>String(n).padStart(2,'0'),today=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,now=new Date().toISOString();
                const x=new Date(d); x.setDate(x.getDate()+((8-x.getDay())%7||7)); const nextMon=`${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`;
                localStorage.clear();
                localStorage.setItem('doctrin-things-todo-v1',JSON.stringify({version:5,appVersion:'4.1.0',updatedAt:now,tasks:[
                  {id:'t1',title:'Due today + next',notes:'',dueDate:today,tags:{next:true,followup:false,some:false,nextWeekFor:nextMon},completed:false,completedAt:null,cleared:false,path:['Alpha','Beta'],level:2,createdAt:now},
                  {id:'t2',title:'Same path',notes:'',dueDate:'',tags:{next:false,followup:false,some:false,nextWeekFor:null},completed:false,completedAt:null,cleared:false,path:['Alpha','Beta'],level:2,createdAt:now},
                  {id:'t3',title:'Dated next week',notes:'',dueDate:nextMon,tags:{next:false,followup:false,some:false,nextWeekFor:null},completed:false,completedAt:null,cleared:false,path:['Other'],level:1,createdAt:now}],backlog:[
                  {id:'b1',type:'bug',title:'Test bug',description:'Bug description',selected:true,comment:'',status:'open',createdAt:now,updatedAt:now}]}));
              });
              await page.reload();
              assert(Number(await page.locator('#cToday').textContent())===1,'Today counter');
              assert(Number(await page.locator('#cUpcoming').textContent())===2,'Upcoming counter');
              assert(Number(await page.locator('#cNext').textContent())===2,'Next wk counter including dated item');
              await page.locator('button[data-view="today"]').click();
              await page.getByText('Due today + next',{exact:true}).waitFor({state:'visible'});

              await page.locator('button[data-view="open"]').click();
              assert(await page.locator('.task').count()===3,'expected three tasks');
              const group=page.locator('[data-collapse]').filter({hasText:'Alpha › Beta'}).first();
              await group.click(); assert(await page.locator('.task').count()===1,'collapse same-path group');
              await group.click(); assert(await page.locator('.task').count()===3,'expand same-path group');

              await page.locator('.task[data-id="t1"] .path-chip').click();
              await page.locator('#inlinePath').fill('Gamma / Delta');
              await page.locator('[data-action="inline-save"]').click();
              await page.getByText('Gamma › Delta',{exact:true}).first().waitFor({state:'visible'});

              await page.locator('button[data-view="history"]').click();
              const row=page.locator('[data-backlog="b1"]'); await row.waitFor({state:'visible'});
              await row.locator('[data-bfield="comment"]').fill('Implement carefully'); await row.locator('[data-bfield="comment"]').press('Tab');
              await page.locator('#generatePromptBtn').click(); const prompt=await page.locator('#promptBox').inputValue();
              assert(prompt.includes('[BUG] Test bug'),'prompt missing bug'); assert(prompt.includes('Implement carefully'),'prompt missing comment');
              await page.locator('#backlogType').selectOption('improvement'); await page.locator('#backlogTitle').fill('Smoke improvement'); await page.locator('#backlogAddBtn').click();
              await page.getByDisplayValue('Smoke improvement').waitFor({state:'visible'});
              assert(errs.length===0,`page errors: ${errs.join(';')}`);
              console.log('NORMAL_UI_GATE PASS');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node smoke.cjs

      - name: Update test log and finalize tested branch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TEST_LOG_v4.1.0.md'); s=p.read_text()
          s=s.replace('- Automated functional/regression suite: **60/60 PASS**','- Latest local automated functional/regression suite after browser-found render fix: **63/63 PASS**')
          s += '''\n\n## Publication-gate defect found and corrected\n\nA real Chromium gate exposed a second Today defect after the original predicate fix. The Today count was correct, but the rendered list was empty. Root cause: date helpers were deliberately extended with an optional `base` argument for deterministic testing, while some code still passed those functions directly to `Array.filter`. JavaScript therefore supplied the array index as the second argument (`base`), making index 0 evaluate dates against 1970.\n\nCorrective code change:\n- all affected `filter(isOverdue)`, `filter(dueToday)`, `filter(isInUpcoming)` and `filter(isDueNextWeek)` calls now use explicit one-argument arrow callbacks;\n- regression coverage was added for actual Today rendering, overdue rendering and Upcoming/Next wk counters.\n\nLatest local deterministic suite after this correction: **63/63 PASS**.\n\n## GitHub Actions final browser gate\n\n- Exact corrected candidate SHA-256 / byte length: **PASS**\n- JavaScript syntax (`node --check`): **PASS**\n- Embedded regression suite in real headless Chromium: **54/54 PASS**\n- Normal UI: Today renders a due-today item also tagged Next wk: **PASS**\n- Normal UI: Upcoming counter includes dated items: **PASS**\n- Normal UI: Next wk counter includes both tagged and next-week-dated items: **PASS**\n- Normal UI: same-path collapse / expand: **PASS**\n- Normal UI: path edit through path chip: **PASS**\n- Normal UI: editable bug backlog, implementation comment and generated prompt: **PASS**\n- Normal UI: add improvement backlog item: **PASS**\n- Browser page errors in tested flows: **0**\n- Live Dropbox write: **not performed** to protect production data; serialization/revision/conflict behavior is covered by deterministic tests.\n\n**Final publication gate: PASS.**\n'''
          p.write_text(s)
          PY
          git rm -r -- .staging
          git rm -- .github/workflows/diagnose-v41.yml .github/workflows/publish-v41.yml .github/workflows/finalize-v41.yml .github/workflows/finalize-v41b.yml .github/workflows/finalize-v41c.yml .github/workflows/diagnose-normal-load-v41.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html TEST_LOG_v4.1.0.md
          git commit -m "[v41-final] Publish todo v4.1.0" -m "Passed 63/63 local deterministic tests, 54/54 embedded Chromium tests and normal UI browser gates."
          git push
