name: Publish Todo v4.1 gate

on:
  push:
    branches:
      - chatgpt/v4.1
    paths:
      - .github/workflows/publish-v41.yml

permissions:
  contents: write

jobs:
  gate-and-finalize:
    if: ${{ !contains(github.event.head_commit.message, '[v41-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact candidate
        run: |
          cat .staging/v41_*.b64 | base64 -d > index.html
          echo "3581ae3d6394c83c23a234926662a32ad8585219c0cb075da4162959147a1242  index.html" | sha256sum -c -
          test "$(wc -c < index.html)" -eq 72834
          grep -q 'const APP_VERSION="4.1.0"' index.html
          ! grep -q 'CAPA-251' index.html

      - name: JavaScript syntax gate
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          m=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(m)==1, f'Expected one script, found {len(m)}'
          open('/tmp/app.js','w',encoding='utf-8').write(m[0])
          PY
          node --check /tmp/app.js

      - name: Install Chromium test runtime
        run: |
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 8765 > /tmp/todo-http.log 2>&1 &
          echo $! > /tmp/todo-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 0.5; done
          cat /tmp/todo-http.log
          exit 1

      - name: Chromium functional and regression smoke
        run: |
          cat > /tmp/smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = (v, m) => { if (!v) throw new Error(m); };
          (async () => {
            const browser = await chromium.launch({headless:true});
            try {
              // 1) Run the application's complete embedded regression suite in a real browser.
              const self = await browser.newPage();
              const selfErrors=[];
              self.on('pageerror', e => selfErrors.push(e.message));
              await self.goto('http://127.0.0.1:8765/?selftest=1', {waitUntil:'domcontentloaded'});
              await self.waitForFunction(() => document.documentElement.dataset.selftest === 'pass', null, {timeout:30000});
              const summary=(await self.locator('#testSummary').textContent()).trim();
              assert(summary === '60/60 PASS', `Embedded self-test: ${summary}`);
              assert(selfErrors.length === 0, `Self-test page errors: ${selfErrors.join('; ')}`);
              await self.close();

              // 2) Exercise normal UI with deterministic local data. No Dropbox calls or user data.
              const ctx=await browser.newContext();
              await ctx.addInitScript(() => {
                const d=new Date();
                const pad=n=>String(n).padStart(2,'0');
                const today=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
                const now=new Date().toISOString();
                const emptyTags={next:false,followup:false,some:false,nextWeekFor:null};
                const payload={version:5,appVersion:'4.1.0',updatedAt:now,tasks:[
                  {id:'seed-today',title:'Seed today',notes:'',dueDate:today,tags:{next:true,followup:false,some:false,nextWeekFor:today},completed:false,completedAt:null,cleared:false,path:['Alpha','Beta'],level:2,createdAt:now},
                  {id:'seed-path',title:'Seed same path',notes:'',dueDate:'',tags:emptyTags,completed:false,completedAt:null,cleared:false,path:['Alpha','Beta'],level:2,createdAt:now}
                ],backlog:[
                  {id:'seed-bug',type:'bug',title:'Seed bug',description:'Smoke test backlog',selected:true,comment:'',status:'open',createdAt:now,updatedAt:now}
                ]};
                localStorage.setItem('doctrin-things-todo-v1',JSON.stringify(payload));
                localStorage.removeItem('doctrin-todo-dropbox-token-v1');
                localStorage.removeItem('doctrin-todo-dropbox-connected-v1');
                localStorage.removeItem('doctrin-todo-dropbox-rev-v1');
                localStorage.removeItem('doctrin-todo-collapsed-v1');
              });
              const page=await ctx.newPage();
              const pageErrors=[];
              page.on('pageerror', e => pageErrors.push(e.message));
              await page.goto('http://127.0.0.1:8765/', {waitUntil:'domcontentloaded'});

              // Today regression: due today + Next wk must still be visible in Today.
              await page.locator('button[data-view="today"]').click();
              await page.getByText('Seed today',{exact:true}).waitFor({state:'visible'});
              assert(Number(await page.locator('#cToday').textContent()) >= 1, 'Today count did not include due-today Next wk item');

              // Exact-path grouping, collapse and expand.
              await page.locator('button[data-view="open"]').click();
              assert(await page.locator('.task').count() === 2, 'Expected two seeded tasks before collapse');
              const pathHead=page.locator('[data-collapse]').first();
              assert((await pathHead.textContent()).includes('Alpha › Beta'), 'Expected exact path group header');
              await pathHead.click();
              assert(await page.locator('.task').count() === 0, 'Collapse did not hide grouped tasks');
              await pathHead.click();
              assert(await page.locator('.task').count() === 2, 'Expand did not restore grouped tasks');

              // Path edit through task path chip.
              await page.locator('.task[data-id="seed-today"] .path-chip').click();
              await page.locator('#inlinePath').fill('Gamma / Delta');
              await page.locator('[data-action="inline-save"]').click();
              await page.getByText('Gamma › Delta',{exact:true}).first().waitFor({state:'visible'});

              // Synced backlog UI + implementation comment + prompt generation.
              await page.locator('button[data-view="history"]').click();
              const row=page.locator('[data-backlog="seed-bug"]');
              await row.waitFor({state:'visible'});
              await row.locator('[data-bfield="comment"]').fill('Ship carefully');
              await row.locator('[data-bfield="comment"]').press('Tab');
              await page.locator('#generatePromptBtn').click();
              const prompt=await page.locator('#promptBox').inputValue();
              assert(prompt.includes('[BUG] Seed bug'), 'Generated prompt missing selected bug');
              assert(prompt.includes('Ship carefully'), 'Generated prompt missing implementation comment');

              // Add another backlog item using the actual UI.
              await page.locator('#backlogType').selectOption('improvement');
              await page.locator('#backlogTitle').fill('Smoke improvement');
              await page.locator('#backlogAddBtn').click();
              await page.getByDisplayValue('Smoke improvement').waitFor({state:'visible'});

              assert(pageErrors.length === 0, `Normal UI page errors: ${pageErrors.join('; ')}`);
              await ctx.close();
              console.log('BROWSER_GATE_PASS: embedded=60/60; today=PASS; collapse=PASS; path-edit=PASS; backlog=PASS; prompt=PASS');
            } finally {
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
          node /tmp/smoke.cjs

      - name: Record browser gate and finalize branch
        run: |
          cat >> TEST_LOG_v4.1.0.md <<'EOF'

          ## GitHub Actions browser gate

          - Candidate SHA-256 and byte length: **PASS**
          - JavaScript `node --check`: **PASS**
          - Real headless Chromium launch: **PASS**
          - Embedded application regression suite in Chromium: **60/60 PASS**
          - Normal UI: Today shows a task due today even when also flagged `Next wk`: **PASS**
          - Normal UI: same-path collapse/expand: **PASS**
          - Normal UI: path edit through the path chip: **PASS**
          - Normal UI: editable backlog, implementation comment and prompt generation: **PASS**
          - Normal UI: add improvement backlog item: **PASS**
          - Browser page errors during tested flows: **0**
          - Live Dropbox write: **not performed** (production-data safety); Dropbox write/conflict behavior remains covered by deterministic mocks.

          **Publication browser gate: PASS.**
          EOF
          rm -rf .staging
          git rm -- .github/workflows/publish-v41.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html TEST_LOG_v4.1.0.md
          git commit -m "[v41-final] Publish todo v4.1.0" -m "Validated with 60/60 embedded regression tests and real Chromium UI smoke tests."
          git push
