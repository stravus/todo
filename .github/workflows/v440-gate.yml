name: Todo v4.4.0 workflow gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static syntax compatibility and privacy
        run: |
          set -euo pipefail
          test "$(git hash-object app-versions/v4.2.1.html)" = "2668975790e87a13d004b50c34c473db5d3062ce"
          test "$(git hash-object app-versions/v4.2.0.html)" = "ab5484362d86ffdb4b7fc4cd246fb37c86aca48c"
          test "$(git hash-object app-versions/v4.4.0.html)" = "$(git hash-object index.html)"
          grep -q 'const SHELL_VERSION="4.4.0"' index.html
          grep -q 'featureVersion:1' index.html
          grep -q 'app-versions/v4.4-addon-1.js' index.html
          cat app-versions/v4.4-addon-*.js > /tmp/addon.js
          grep -q 'const V440_VERSION="4.4.0"' /tmp/addon.js
          grep -q 'mergePayloads' /tmp/addon.js
          grep -q 'renderWeek' /tmp/addon.js
          grep -q 'addTodoComment' /tmp/addon.js
          grep -q 'moveTaskToView' /tmp/addon.js
          ! grep -R -E 'sk-live-|github_pat_|ghp_|CAPA-251|Medical history report' index.html app-versions/v4.4-addon-*.js TEST_LOG_v4.4.0.md
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>\s*(.*?)\s*</script>\s*</body>',s,re.S)
          assert m
          Path('/tmp/root.js').write_text(m.group(1))
          PY
          node --check /tmp/root.js
          node --check /tmp/addon.js
          git diff --check origin/main...HEAD

      - name: Pure shell selection tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(); js=re.search(r'<script>\s*(.*?)\s*</script>\s*</body>',s,re.S).group(1)
          base=js.rsplit('boot();',1)[0]
          tests=r'''
          const mem=new Map(); global.localStorage={getItem:k=>mem.has(k)?mem.get(k):null,setItem:(k,v)=>mem.set(k,String(v)),removeItem:k=>mem.delete(k)};
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          assert(currentSelection().version==='4.4.0','default current');
          localStorage.setItem(DATA_STORAGE_KEY,JSON.stringify({version:6,featureVersion:1,tasks:[]}));
          assert(currentSelection().version==='4.4.0','feature1 current');
          localStorage.setItem(APP_PIN_KEY,'4.3.0'); assert(currentSelection().version==='4.4.0','feature1 must block old pin');
          localStorage.setItem(DATA_STORAGE_KEY,JSON.stringify({version:6,tasks:[]})); localStorage.setItem(APP_PIN_KEY,'4.3.0');
          assert(currentSelection().version==='4.3.0','feature0 historical restore');
          assert(deferInit('x\ninit();\n</script>\ny').includes('init deferred'),'defer init');
          console.log('PURE_SHELL_PASS');
          '''
          Path('/tmp/pure.js').write_text(base+tests)
          PY
          node --check /tmp/pure.js
          node /tmp/pure.js

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Real Chromium functional migration and drag regression
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          echo $! >/tmp/http.pid
          sleep 1
          python3 - <<'PY'
          import base64
          open('/tmp/pixel.png','wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='))
          PY
          cat > /tmp/browser.cjs <<'JS'
          const { chromium } = require(process.cwd()+'/node_modules/playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const base='http://127.0.0.1:8000/';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];

            const st=await browser.newContext(); const sp=await st.newPage(); sp.on('pageerror',e=>errors.push('selftest:'+e.message));
            await sp.goto(base+'?selftest=1',{waitUntil:'domcontentloaded'}); await sp.locator('#testSummary').waitFor({timeout:15000});
            const summary=(await sp.locator('#testSummary').textContent()).trim(); assert(/^\d+\/\d+ PASS$/.test(summary),'embedded regression '+summary); await st.close();

            const c=await browser.newContext(); const p=await c.newPage(); p.on('pageerror',e=>errors.push('desktop:'+e.message)); await p.goto(base,{waitUntil:'domcontentloaded'});
            const legacy={version:6,appVersion:'4.3.0',updatedAt:'2026-08-22T07:00:00.000Z',tasks:[
              {id:'a',title:'Alpha',notes:'',dueDate:'',tags:{next:false,followup:false,some:false,nextWeekFor:null},completed:false,completedAt:null,cleared:false,path:['Synthetic'],level:1,createdAt:'2026-08-22T06:00:00.000Z'},
              {id:'b',title:'Beta',notes:'',dueDate:'',tags:{next:false,followup:true,some:false,nextWeekFor:null},completed:false,completedAt:null,cleared:false,path:['Synthetic'],level:1,createdAt:'2026-08-22T06:01:00.000Z'},
              {id:'c',title:'Gamma',notes:'',dueDate:'',tags:{next:false,followup:false,some:true,nextWeekFor:null},completed:false,completedAt:null,cleared:false,path:['Synthetic'],level:1,createdAt:'2026-08-22T06:02:00.000Z'}],backlog:[],devJobs:[]};
            await p.evaluate(x=>localStorage.setItem('doctrin-things-todo-v1',JSON.stringify(x)),legacy); await p.reload({waitUntil:'domcontentloaded'}); await p.locator('#viewTitle').waitFor();
            let migrated=await p.evaluate(()=>JSON.parse(localStorage.getItem('doctrin-things-todo-v1'))); assert(migrated.version===6&&migrated.featureVersion===1,'feature migration'); assert(migrated.appVersion==='4.4.0','app metadata'); assert(migrated.tasks.every(t=>Array.isArray(t.comments)&&t.order>0&&typeof t.inbox==='boolean'),'task defaults');

            await p.getByRole('button',{name:/Alla öppna/}).click();
            const orderBefore=await p.locator('.task[data-id]').evaluateAll(es=>es.map(e=>e.dataset.id)); assert(orderBefore.join(',')==='a,b,c','initial order '+orderBefore);
            await p.locator('.task[data-id="b"] .check').click();
            const orderAfter=await p.locator('.task[data-id]').evaluateAll(es=>es.map(e=>e.dataset.id)); assert(orderAfter.join(',')==='a,b,c','completion moved task '+orderAfter);

            await p.getByRole('button',{name:/Inbox/}).click(); await p.locator('#newTitle').fill('Inbox smoke'); await p.locator('#addBtn').click();
            let inbox=await p.evaluate(()=>state.tasks.find(t=>t.title==='Inbox smoke')); assert(inbox&&inbox.inbox===true,'inbox quick add'); assert(await p.locator('.task').filter({hasText:'Inbox smoke'}).count()===1,'inbox render');

            await p.evaluate(()=>{const b=state.tasks.find(t=>t.id==='b'),c=state.tasks.find(t=>t.id==='c');b.completed=true;b.completedAt=new Date().toISOString();b.cleared=false;c.completed=true;c.completedAt=new Date().toISOString();c.cleared=false;save();render()});
            await p.getByRole('button',{name:/Follow-up/}).click(); await p.locator('#clearBtn').click();
            const cleared=await p.evaluate(()=>state.tasks.filter(t=>['b','c'].includes(t.id)).every(t=>t.cleared)); assert(cleared,'global clear did not clear hidden completed');

            await p.evaluate(()=>{const a=state.tasks.find(t=>t.id==='a');a.cleared=false;a.completed=false;a.dueDate=isoDate(weekBounds().currentMonday);a.inbox=false;touchTask(a);save();render()});
            await p.getByRole('button',{name:/Veckoschema/}).click(); assert(await p.locator('.week-day').count()===14,'week must render 14 days'); assert(await p.locator('.week-day .task[data-id="a"]').count()===1,'week task missing');
            const nextDate=await p.evaluate(()=>isoDate(addDays(weekBounds().currentMonday,1))); const nextDay=p.locator(`.week-day[data-date="${nextDate}"]`); await p.locator('.week-day .task[data-id="a"]').dragTo(nextDay);
            assert(await p.evaluate(d=>state.tasks.find(t=>t.id==='a').dueDate===d,nextDate),'drag to day failed');
            await p.locator(`.week-day[data-date="${nextDate}"] .task[data-id="a"]`).dragTo(p.getByRole('button',{name:/Inbox/}));
            assert(await p.evaluate(()=>{const t=state.tasks.find(t=>t.id==='a');return t.inbox&&!t.dueDate}),'drag to inbox failed');

            await p.getByRole('button',{name:/Alla öppna/}).click(); await p.locator('.task[data-id="a"] [data-action="edit"]').click(); await p.locator('#commentText').fill('Synthetic image comment'); await p.locator('#commentImages').setInputFiles('/tmp/pixel.png'); await p.locator('#commentPending').filter({hasText:'1 bild'}).waitFor(); await p.locator('#addCommentBtn').click();
            const comment=await p.evaluate(()=>state.tasks.find(t=>t.id==='a').comments[0]); assert(comment.text==='Synthetic image comment'&&comment.images.length===1&&comment.images[0].dataUrl.startsWith('data:image/'),'image comment persistence'); assert(await p.locator('#commentList img').count()===1,'image comment render');
            const remote=await p.evaluate(()=>remotePayload()); assert(remote.featureVersion===1&&remote.tasks.find(t=>t.id==='a').comments.length===1,'remote comment payload');

            const merged=await p.evaluate(()=>mergePayloads({tasks:[{id:'x',title:'local',updatedAt:'2026-08-22T08:00:00Z'},{id:'l',title:'local-only',updatedAt:'2026-08-22T08:00:00Z'}],backlog:[],devJobs:[]},{tasks:[{id:'x',title:'remote',updatedAt:'2026-08-22T07:00:00Z'},{id:'r',title:'remote-only',updatedAt:'2026-08-22T07:00:00Z'}],backlog:[],devJobs:[]})); assert(merged.tasks.length===3&&merged.tasks.find(t=>t.id==='x').title==='local','conflict merge');

            await p.locator('#drawerBack').click(); await p.locator('#toolVersionButton').click(); const oldButton=p.locator('[data-tv-run="4.3.0"]'); assert(await oldButton.count()===0,'old compatible action should be blocked after feature migration'); assert((await p.locator('#toolVersionCard').textContent()).includes('Restore blockerad'),'blocked version copy missing');
            await c.close();

            const mobile=await browser.newContext({viewport:{width:390,height:844}}); const mp=await mobile.newPage(); mp.on('pageerror',e=>errors.push('mobile:'+e.message)); await mp.goto(base,{waitUntil:'domcontentloaded'}); await mp.getByRole('button',{name:/Veckoschema/}).click(); assert(await mp.locator('.week-day').count()===14,'mobile week'); await mp.locator('#toolVersionButton').click(); assert(await mp.locator('#toolVersionCard').isVisible(),'mobile version manager'); await mobile.close();

            assert(errors.length===0,'page errors: '+errors.join(' | ')); console.log('V440_BROWSER_PASS',summary,'errors',errors.length); await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/browser.cjs
          kill $(cat /tmp/http.pid) || true
