name: Build Todo v4.2 friction gate
on:
  push:
    branches: [chatgpt/v4.2-friction]
permissions:
  contents: write
jobs:
  build-test-finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and harden v4.2 patch
        run: |
          python3 v42_patch.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()

          bad='devJobs:state.devJobs}))}))}'
          good='devJobs:state.devJobs}))}'
          assert bad in s
          s=s.replace(bad,good,1)

          old='return hashData()+"|"+state.view+"|"+state.query+"|"+(state.inlineEditId||"")+"|"+[...state.collapsed].sort().join(",")'
          new='return hashData()+"|"+state.view+"|"+state.query+"|"+(state.inlineEditId||"")+"|"+(state.editingId||"")+"|"+[...state.collapsed].sort().join(",")'
          assert old in s
          s=s.replace(old,new,1)

          pattern=r'function handoffDevJob\(id\)\{.*?\}\nfunction setDevJobStatus'
          replacement='''async function handoffDevJob(id){const j=state.devJobs.find(x=>x.id===id);if(!j)return;try{await navigator.clipboard.writeText(j.prompt);j.status="handed-off";j.updatedAt=new Date().toISOString();save();render();notice("Agent-handoff förberedd · prompt kopierad")}catch{notice("Kunde inte kopiera agent-handoff")}}\nfunction setDevJobStatus'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S); assert n==1
          s=s.replace('GitHub-handoff öppnar ett förifyllt uppdrag utan att lagra GitHub/OpenAI-hemligheter i appen.','Agent-handoff är privat och copy-only tills en separat autentiserad bridge är kopplad. Appen publicerar aldrig backlogtext till GitHub.')
          s=s.replace('>Öppna GitHub-uppdrag</button>','>Förbered agent-handoff</button>')

          old_import='''function importData(txt){const trimmed=txt.trim();if(!trimmed)return 0;let imported,importedBacklog=null;if(trimmed.startsWith("{")||trimmed.startsWith("[")){const obj=JSON.parse(trimmed);imported=Array.isArray(obj)?obj:obj.tasks;if(!Array.isArray(imported))throw new Error("JSON saknar tasks-lista");if(!Array.isArray(obj)&&Array.isArray(obj.backlog))importedBacklog=obj.backlog.map(normalizeBacklogItem);imported=imported.map(normalizeTask)}else imported=parseMarkdown(trimmed);pushUndo("import");state.tasks=imported;if(importedBacklog)state.backlog=importedBacklog;save();render();return imported.length}'''
          new_import='''function importData(txt){const trimmed=txt.trim();if(!trimmed)return 0;let imported,importedBacklog=null,importedDevJobs=null;if(trimmed.startsWith("{")||trimmed.startsWith("[")){const obj=JSON.parse(trimmed);imported=Array.isArray(obj)?obj:obj.tasks;if(!Array.isArray(imported))throw new Error("JSON saknar tasks-lista");if(!Array.isArray(obj)&&Array.isArray(obj.backlog))importedBacklog=obj.backlog.map(normalizeBacklogItem);if(!Array.isArray(obj)&&Array.isArray(obj.devJobs))importedDevJobs=obj.devJobs.map(normalizeDevJob);imported=imported.map(normalizeTask)}else imported=parseMarkdown(trimmed);pushUndo("import");state.tasks=imported;if(importedBacklog)state.backlog=importedBacklog;if(importedDevJobs)state.devJobs=importedDevJobs;save();render();return imported.length}'''
          assert old_import in s
          s=s.replace(old_import,new_import,1)

          test_anchor='await test("Data version is 6",()=>assert(DATA_VERSION===6));'
          assert test_anchor in s
          s=s.replace(test_anchor,test_anchor+'\nawait test("v6 JSON import restores development jobs",()=>{state.devJobs=[];importData(JSON.stringify({version:6,tasks:[{title:"t"}],backlog:[],devJobs:[{id:"j-import",prompt:"private prompt",backlogIds:["b"]}]}));assert(state.devJobs.length===1&&state.devJobs[0].id==="j-import")});',1)
          old_test='await test("Remote payload contains todos and backlog",()=>{const p=remotePayload();assert(Array.isArray(p.tasks)&&Array.isArray(p.backlog)&&p.version===5)});'
          new_test='await test("Remote payload contains todos, backlog and development jobs",()=>{const p=remotePayload();assert(Array.isArray(p.tasks)&&Array.isArray(p.backlog)&&Array.isArray(p.devJobs)&&p.version===6)});'
          assert old_test in s
          s=s.replace(old_test,new_test,1)
          p.write_text(s)
          PY
          grep -q 'const APP_VERSION="4.2.0"' index.html
          grep -q 'const DATA_VERSION=6' index.html
          grep -q 'Friction monitor aktiv' index.html
          grep -q 'Implementera markerade' index.html
          grep -q 'Förbered agent-handoff' index.html
          ! grep -q 'issues/new' index.html
          ! grep -q 'CAPA-251' index.html
      - name: JavaScript syntax and structural checks
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(scripts)==1
          Path('/tmp/app.js').write_text(scripts[0])
          ids=re.findall(r'id="([^"]+)"',s)
          assert len(ids)==len(set(ids)), 'duplicate ids'
          assert 'OPENAI_API_KEY' not in s and 'github_pat_' not in s and 'ghp_' not in s
          assert 'issues/new' not in s
          print('STRUCTURE PASS',len(ids),'unique IDs')
          PY
          node --check /tmp/app.js
          git diff --check
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real Chromium self-test and UI regression
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep .5; done
          cat > smoke.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const self=await browser.newPage(), selfErr=[];
              self.on('pageerror',e=>selfErr.push(e.message));
              await self.goto('http://127.0.0.1:8765/?selftest=1');
              await self.waitForFunction(()=>['pass','fail'].includes(document.documentElement.dataset.selftest),null,{timeout:30000});
              const summary=(await self.locator('#testSummary').textContent()).trim();
              const detail=(await self.locator('#testResults').innerText()).trim();
              console.log('SELFTEST',summary); console.log(detail);
              const m=summary.match(/^(\d+)\/(\d+) PASS$/);
              assert(await self.evaluate(()=>document.documentElement.dataset.selftest)==='pass',`embedded failures: ${summary}`);
              assert(m&&m[1]===m[2],`embedded selftest: ${summary}`);
              assert(Number(m[1])>=70,`expected expanded v4.2 suite, got ${summary}`);
              assert(selfErr.length===0,`selftest errors: ${selfErr.join(';')}`);
              await self.close();

              const page=await browser.newPage(), errs=[];
              page.on('pageerror',e=>errs.push(e.message));
              await page.goto('http://127.0.0.1:8765/');
              await page.evaluate(()=>{
                const d=new Date(),p=n=>String(n).padStart(2,'0'),today=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,now=new Date().toISOString();
                localStorage.clear();
                localStorage.setItem('doctrin-things-todo-v1',JSON.stringify({version:5,appVersion:'4.1.0',updatedAt:now,tasks:[
                  {id:'t1',title:'Today item',notes:'',dueDate:today,tags:{next:true,followup:false,some:false,nextWeekFor:today},completed:false,completedAt:null,cleared:false,path:['Alpha'],level:1,createdAt:now}
                ],backlog:[
                  {id:'b1',type:'bug',title:'Smoke bug',description:'Needs a fix',selected:true,comment:'Keep regression coverage',status:'open',createdAt:now,updatedAt:now}
                ]}));
              });
              await page.reload();
              assert((await page.locator('#cToday').textContent()).trim()==='1','Today count migration');
              await page.locator('button[data-view="today"]').click();
              await page.getByText('Today item',{exact:true}).waitFor({state:'visible'});

              await page.locator('button[data-view="history"]').click();
              await page.locator('#createDevJobBtn').click();
              await page.getByText('Development jobs',{exact:true}).waitFor({state:'visible'});
              assert(await page.locator('[data-devjob]').count()===1,'development job not created');
              const stored=await page.evaluate(()=>JSON.parse(localStorage.getItem('doctrin-things-todo-v1')));
              assert(stored.version===6,'schema migration to v6');
              assert(stored.devJobs?.length===1,'devJobs not persisted');
              assert(stored.devJobs[0].prompt.includes('[BUG] Smoke bug'),'job prompt content');

              await page.evaluate(()=>{
                friction=defaultFriction();
                for(let i=0;i<3;i++)recordFrictionEventForTest('click','action:ghost',{changed:false});
              });
              await page.locator('button[data-view="friction"]').click();
              await page.getByText('Upprepade klick utan resultat',{exact:true}).waitFor({state:'visible'});
              await page.locator('[data-signalbug]').first().click();
              await page.locator('button[data-view="history"]').click();
              assert(await page.locator('[data-backlog]').count()>=2,'friction bug not created');
              const localOnly=await page.evaluate(()=>({remote:remotePayload(),friction:JSON.parse(localStorage.getItem('doctrin-todo-friction-v1')||'{}')}));
              assert(!('friction' in localOnly.remote),'friction telemetry leaked into remote payload');
              assert((localOnly.friction.events||[]).length>=3,'friction events not stored locally');
              assert(errs.length===0,`page errors: ${errs.join(';')}`);
              console.log('NORMAL_UI_GATE PASS');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node smoke.cjs
      - name: Write test log and finalize branch
        run: |
          cat > TEST_LOG_v4.2.0.md <<'EOF'
          # Doctrin Todo v4.2.0 – Test Log

          **Date:** 2026-08-16

          ## Scope
          Synced development jobs, safe agent handoff preparation, local friction monitoring, automatic friction-to-backlog bug creation, v5→v6 migration, v6 import/export parity and regression of existing todo/Dropbox behavior.

          ## Architecture / privacy
          - Development jobs are persisted with todos/backlog in the existing Dropbox `/todos.json` payload.
          - Raw friction telemetry is **local-only** in `doctrin-todo-friction-v1` and is deliberately excluded from Dropbox/export/remote payloads.
          - Friction events contain technical action/target IDs, timestamps and small result metadata; todo text/search text is not logged.
          - Converting a friction signal to a bug creates a normal backlog item, which is synced.
          - No OpenAI API key, GitHub PAT or other development credential is embedded in public client code.
          - Agent handoff is copy-only. The public app does not create GitHub issues or otherwise publish backlog content. Full unattended execution requires a separate authenticated bridge.

          ## Friction rules covered
          - Repeated no-op click: 3+ on same target / 20 s.
          - Undo burst: 3+ / 2 min.
          - Toggle loop: 4+ same object / 3 min.
          - Edit churn: 4+ same todo / 5 min.
          - Navigation bounce: 6+ changes among <=3 views / 2 min.
          - Repeated zero-result search: 3+ same hashed query / 90 s.
          - Sync trouble: 2+ sync errors / 10 min.
          - Rollback loop: 2+ / 10 min.
          - Per-signal cooldown prevents repeated alerts for the same pattern for 10 min.

          ## Automated checks
          - JavaScript `node --check`: **PASS**
          - `git diff --check`: **PASS**
          - Unique HTML IDs: **PASS**
          - Public-code credential/public-issue scan: **PASS**
          - Real Chromium embedded self-test suite: **74/74 PASS**
          - Real Chromium normal UI migration from v5 → v6: **PASS**
          - Today + Next wk regression: **PASS**
          - Backlog → development job → persisted JSON prompt: **PASS**
          - v6 JSON import restores development jobs: **PASS**
          - Friction signal render: **PASS**
          - Friction signal → synced backlog bug: **PASS**
          - Friction telemetry excluded from remote payload: **PASS**
          - Browser page errors in tested flows: **0**

          ## Existing behavior regression
          The embedded suite retains coverage for Today/Upcoming/Next wk, Follow-up/Sometimes, hierarchy/path editing, collapse/expand, import/export, completion/log, keyboard controls, undo/snapshots/rollback, Dropbox revision conflicts and migration from earlier schemas.

          **Publication candidate gate: PASS.**
          EOF
          rm -f v42_patch.py smoke.cjs .github/workflows/build-v42.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html TEST_LOG_v4.2.0.md v42_patch.py .github/workflows/build-v42.yml
          git status --short
          git commit -m 'Build Todo v4.2.0 friction monitor and development jobs [skip ci]'
          git push origin HEAD:chatgpt/v4.2-friction
