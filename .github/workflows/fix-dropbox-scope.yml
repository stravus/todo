name: Fix Dropbox sync scope

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Dropbox sync functions out of render
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          render_start = s.index('function render(){')
          block_start = s.index('const syncState={', render_start)
          block_end = s.index('document.querySelectorAll(".nav button")', block_start)
          dbx = s[block_start:block_end]
          s = s[:block_start] + s[block_end:]
          render_start = s.index('function render(){')
          s = s[:render_start] + dbx + '\n' + s[render_start:]
          p.write_text(s)
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/todo.js').write_text(s[s.index('<script>')+8:s.rindex('</script>')])
          PY
          node --check /tmp/todo.js
      - name: Commit fixed index
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Fix Dropbox sync function scope [skip ci]"
          git push
