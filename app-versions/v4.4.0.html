<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.dropboxapi.com https://content.dropboxapi.com; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; object-src 'none'">
<title>Todo</title>
<style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f6f3;color:#2d2b27}.boot{min-height:100vh;display:grid;place-items:center}.boot-card{background:#fff;border:1px solid #dedbd2;border-radius:14px;padding:18px 22px;box-shadow:0 8px 28px rgba(45,42,35,.08);font-size:13px}.boot-error{max-width:620px;line-height:1.5}.boot-error button{margin-top:12px;border:1px solid #dedbd2;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}</style>
</head>
<body>
<div class="boot"><div class="boot-card" id="bootStatus">Startar Todo…</div></div>
<script>
"use strict";
const SHELL_VERSION="4.4.0";
const DATA_STORAGE_KEY="doctrin-things-todo-v1";
const APP_PIN_KEY="todo-app-version-pin-v1";
const RELEASES=[
 {version:"4.4.0",coreVersion:"4.2.1",dataVersion:6,featureVersion:1,migratesFromFeatures:[0],path:"app-versions/v4.2.1.html",addons:["app-versions/v4.4-addon-1.js","app-versions/v4.4-addon-2.js","app-versions/v4.4-addon-3.js","app-versions/v4.4-addon-4.js","app-versions/v4.4-addon-5.js"],date:"2026-08-22",label:"Inbox, veckoschema, kommentarer/bilder, drag-and-drop och förbättrad synk"},
 {version:"4.3.0",coreVersion:"4.2.1",dataVersion:6,featureVersion:0,path:"app-versions/v4.2.1.html",date:"2026-08-22",label:"Verktygssnapshots/restore utan datapåverkan"},
 {version:"4.2.1",coreVersion:"4.2.1",dataVersion:6,featureVersion:0,path:"app-versions/v4.2.1.html",date:"2026-08-16",label:"Neutral Todo-branding och checkmark-logga"},
 {version:"4.2.0",coreVersion:"4.2.0",dataVersion:6,featureVersion:0,path:"app-versions/v4.2.0.html",date:"2026-08-16",label:"Development jobs och friction monitor"}
];
function storedData(){try{return JSON.parse(localStorage.getItem(DATA_STORAGE_KEY)||"null")}catch{return null}}
function dataVersion(){return Number(storedData()?.version)||6}
function featureVersion(){return Number(storedData()?.featureVersion)||0}
function releaseByVersion(v){return RELEASES.find(x=>x.version===v)||null}
function compatible(r){return!!r&&r.dataVersion===dataVersion()&&Number(r.featureVersion||0)===featureVersion()}
function currentSelection(){const pin=localStorage.getItem(APP_PIN_KEY)||"";if(pin){const r=releaseByVersion(pin);if(r&&compatible(r))return r;localStorage.removeItem(APP_PIN_KEY)}const current=releaseByVersion(SHELL_VERSION),dv=dataVersion(),fv=featureVersion();return current&&current.dataVersion===dv&&(current.featureVersion===fv||current.migratesFromFeatures?.includes(fv))?current:null}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shellCss(){return `<style id="toolVersionShellStyle">#toolVersionButton{position:fixed;right:14px;bottom:14px;z-index:100001;border:1px solid #d8d4ca;background:#fff;color:#4c4943;border-radius:99px;padding:7px 10px;font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.12);cursor:pointer}#toolVersionModal{display:none;position:fixed;inset:0;z-index:100002;background:rgba(20,20,18,.28);align-items:center;justify-content:center;padding:18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#toolVersionModal.open{display:flex}#toolVersionCard{width:min(650px,96vw);max-height:82vh;overflow:auto;background:#fff;border-radius:15px;padding:20px;box-shadow:0 12px 38px rgba(0,0,0,.2);color:#2d2b27}#toolVersionCard h2{margin:0 0 6px;font-size:20px}#toolVersionCard .tv-note{font-size:11px;line-height:1.5;color:#77736b;margin-bottom:14px}.tv-row{border-top:1px solid #ece9e2;padding:12px 0}.tv-row:first-of-type{border-top:0}.tv-title{font-weight:750}.tv-meta{font-size:11px;color:#8a877f;margin-top:3px}.tv-actions{margin-top:7px;display:flex;gap:6px}.tv-actions button,#toolVersionClose{border:1px solid #dedbd2;background:#faf9f6;border-radius:8px;padding:6px 9px;cursor:pointer;font:inherit}.tv-actions button:disabled{opacity:.5;cursor:default}.tv-pill{display:inline-block;margin-left:5px;border-radius:99px;padding:2px 6px;font-size:10px;background:#e8f2eb;color:#4f855f}#toolVersionClose{float:right}#toolVersionPinBanner{position:fixed;z-index:100000;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#302e2a;color:#fff;padding:8px 11px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>`}
function versionUiScript(selectedVersion){const registry=JSON.stringify(RELEASES);return `<script id="toolVersionShellScript">(()=>{const SHELL_VERSION=${JSON.stringify(SHELL_VERSION)},SELECTED=${JSON.stringify(selectedVersion)},PIN_KEY=${JSON.stringify(APP_PIN_KEY)},DATA_KEY=${JSON.stringify(DATA_STORAGE_KEY)},RELEASES=${registry};const raw=()=>{try{return JSON.parse(localStorage.getItem(DATA_KEY)||"null")}catch{return null}},dv=()=>Number(raw()?.version)||6,fv=()=>Number(raw()?.featureVersion)||0,safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function ok(r){return r.dataVersion===dv()&&Number(r.featureVersion||0)===fv()}function modalHtml(){const rows=RELEASES.map(r=>{const active=r.version===SELECTED,compatible=ok(r);return '<div class="tv-row"><div class="tv-title">v'+safe(r.version)+(active?'<span class="tv-pill">Körs nu</span>':'')+'</div><div class="tv-meta">'+safe(r.date)+' · dataschema '+r.dataVersion+' / funktionsdata '+(r.featureVersion||0)+' · '+safe(r.label)+'</div><div class="tv-actions">'+(active?'<button disabled>Aktiv</button>':compatible?'<button data-tv-run="'+safe(r.version)+'">Kör denna version</button>':'<button disabled>Restore blockerad · datan är inte kompatibel</button>')+'</div></div>'}).join('');return '<div id="toolVersionModal"><div id="toolVersionCard"><button id="toolVersionClose">Stäng</button><h2>Verktygsversioner</h2><div class="tv-note">Byter endast verktygskod. Todos och Dropbox-data ligger kvar. När v4.4-data har skapats blockeras äldre versioner som inte förstår kommentarer, ordning och Inbox.</div>'+rows+'</div></div>'}function install(){if(document.getElementById('toolVersionButton'))return;document.body.insertAdjacentHTML('beforeend','<button id="toolVersionButton" title="Verktygsversioner">v'+safe(SELECTED)+'</button>'+modalHtml());const modal=document.getElementById('toolVersionModal');document.getElementById('toolVersionButton').onclick=()=>modal.classList.add('open');document.getElementById('toolVersionClose').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open');const b=e.target.closest('[data-tv-run]');if(!b)return;const r=RELEASES.find(x=>x.version===b.dataset.tvRun);if(!r||!ok(r))return;if(r.version===SHELL_VERSION)localStorage.removeItem(PIN_KEY);else localStorage.setItem(PIN_KEY,r.version);location.href='./'+location.search+location.hash});if(SELECTED!==SHELL_VERSION){const bar=document.createElement('div');bar.id='toolVersionPinBanner';bar.innerHTML='Kör verktyg v'+safe(SELECTED)+' · data ligger kvar <button id="toolVersionLatest" style="border:0;border-radius:7px;padding:5px 8px;cursor:pointer">Återgå till senaste</button>';document.body.appendChild(bar);document.getElementById('toolVersionLatest').onclick=()=>{localStorage.removeItem(PIN_KEY);location.href='./'+location.search+location.hash}}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();setTimeout(install,0)})();<\/script>`}
function deferInit(html){const out=html.replace(/\ninit\(\);\s*\n<\/script>/,`\n/* init deferred to v4.4 addon */\n<\/script>`);if(out===html)throw new Error('kunde inte defer init');return out}
function inject(html,selected,addon=""){if(addon){html=deferInit(html);const safeAddon=addon.replace(/<\/script/gi,'<\\/script');html=html.replace('</body>',`<script id="v440Addon">${safeAddon}<\/script></body>`)}return html.replace('</head>',shellCss()+'</head>').replace('</body>',versionUiScript(selected.version)+'</body>')}
async function boot(){const selected=currentSelection(),status=document.getElementById('bootStatus');try{if(!selected)throw new Error(`Dataschema ${dataVersion()} / funktionsdata ${featureVersion()} är inte kompatibelt med verktyg v${SHELL_VERSION}. Ingen data har ändrats.`);status.textContent=`Startar Todo v${selected.version}…`;const res=await fetch(selected.path,{cache:'no-store'});if(!res.ok)throw new Error(`snapshot HTTP ${res.status}`);let html=await res.text();if(!html.includes(`const APP_VERSION="${selected.coreVersion}"`)||!html.includes(`const DATA_VERSION=${selected.dataVersion};`))throw new Error('snapshot metadata mismatch');let addon="";if(selected.addons?.length){const parts=[];for(const path of selected.addons){const ar=await fetch(path,{cache:'no-store'});if(!ar.ok)throw new Error(`addon HTTP ${ar.status}`);parts.push(await ar.text())}addon=parts.join("\n")}html=inject(html,selected,addon);document.open();document.write(html);document.close()}catch(e){console.error(e);status.className='boot-card boot-error';status.innerHTML='<strong>Kunde inte starta vald verktygsversion.</strong><br>'+esc(e.message)+'<br><button id="resetToolVersion">Återställ till senaste</button>';document.getElementById('resetToolVersion').onclick=()=>{localStorage.removeItem(APP_PIN_KEY);location.reload()}}}
boot();
</script>
</body>
</html>
