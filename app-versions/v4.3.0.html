<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.dropboxapi.com https://content.dropboxapi.com; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; object-src 'none'">
<title>Todo</title>
<style>
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f6f3;color:#2d2b27}.boot{min-height:100vh;display:grid;place-items:center}.boot-card{background:#fff;border:1px solid #dedbd2;border-radius:14px;padding:18px 22px;box-shadow:0 8px 28px rgba(45,42,35,.08);font-size:13px}.boot-error{max-width:560px;line-height:1.5}.boot-error button{margin-top:12px;border:1px solid #dedbd2;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}
</style>
</head>
<body>
<div class="boot"><div class="boot-card" id="bootStatus">Startar Todo…</div></div>
<script>
"use strict";
const SHELL_VERSION="4.3.0";
const DATA_STORAGE_KEY="doctrin-things-todo-v1";
const APP_PIN_KEY="todo-app-version-pin-v1";
const RELEASES=[
 {version:"4.3.0",coreVersion:"4.2.1",dataVersion:6,migratesFrom:[5],path:"app-versions/v4.2.1.html",date:"2026-08-22",label:"Current · versionshantering utan datapåverkan"},
 {version:"4.2.1",coreVersion:"4.2.1",dataVersion:6,path:"app-versions/v4.2.1.html",date:"2026-08-16",label:"Neutral Todo-branding och checkmark-logga"},
 {version:"4.2.0",coreVersion:"4.2.0",dataVersion:6,path:"app-versions/v4.2.0.html",date:"2026-08-16",label:"Development jobs och friction monitor"}
];
function dataVersion(){try{const x=JSON.parse(localStorage.getItem(DATA_STORAGE_KEY)||"null");return Number(x?.version)||6}catch{return 6}}
function releaseByVersion(v){return RELEASES.find(x=>x.version===v)||null}
function compatible(r){return!!r&&r.dataVersion===dataVersion()}
function currentSelection(){const pin=localStorage.getItem(APP_PIN_KEY)||"";if(pin){const r=releaseByVersion(pin);if(r&&compatible(r))return r;localStorage.removeItem(APP_PIN_KEY)}const current=releaseByVersion(SHELL_VERSION),dv=dataVersion();return current&&(current.dataVersion===dv||current.migratesFrom?.includes(dv))?current:null}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shellCss(){return `<style id="toolVersionShellStyle">#toolVersionButton{position:fixed;right:14px;bottom:14px;z-index:100001;border:1px solid #d8d4ca;background:#fff;color:#4c4943;border-radius:99px;padding:7px 10px;font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.12);cursor:pointer}#toolVersionModal{display:none;position:fixed;inset:0;z-index:100002;background:rgba(20,20,18,.28);align-items:center;justify-content:center;padding:18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#toolVersionModal.open{display:flex}#toolVersionCard{width:min(620px,96vw);max-height:82vh;overflow:auto;background:#fff;border-radius:15px;padding:20px;box-shadow:0 12px 38px rgba(0,0,0,.2);color:#2d2b27}#toolVersionCard h2{margin:0 0 6px;font-size:20px}#toolVersionCard .tv-note{font-size:11px;line-height:1.5;color:#77736b;margin-bottom:14px}.tv-row{border-top:1px solid #ece9e2;padding:12px 0}.tv-row:first-of-type{border-top:0}.tv-title{font-weight:750}.tv-meta{font-size:11px;color:#8a877f;margin-top:3px}.tv-actions{margin-top:7px;display:flex;gap:6px}.tv-actions button,#toolVersionClose{border:1px solid #dedbd2;background:#faf9f6;border-radius:8px;padding:6px 9px;cursor:pointer;font:inherit}.tv-actions button:disabled{opacity:.5;cursor:default}.tv-pill{display:inline-block;margin-left:5px;border-radius:99px;padding:2px 6px;font-size:10px;background:#e8f2eb;color:#4f855f}.tv-warn{background:#fff0ed;color:#b7493b;border-radius:8px;padding:8px 10px;font-size:11px;margin:10px 0}#toolVersionClose{float:right}.tool-version-history{border-top:1px solid #ece9e2;padding:10px 0}.tool-version-history .item-copy{font-size:11px;color:#8a877f;margin-top:3px}</style>`}
function versionUiScript(selectedVersion){const registry=JSON.stringify(RELEASES);return `<script id="toolVersionShellScript">(()=>{const SHELL_VERSION=${JSON.stringify(SHELL_VERSION)},SELECTED=${JSON.stringify(selectedVersion)},PIN_KEY=${JSON.stringify(APP_PIN_KEY)},DATA_KEY=${JSON.stringify(DATA_STORAGE_KEY)},RELEASES=${registry};const dv=()=>{try{return Number(JSON.parse(localStorage.getItem(DATA_KEY)||"null")?.version)||6}catch{return 6}};const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function modalHtml(){const rows=RELEASES.map(r=>{const ok=r.dataVersion===dv(),active=r.version===SELECTED;return '<div class="tv-row"><div class="tv-title">v'+safe(r.version)+(active?'<span class="tv-pill">Körs nu</span>':'')+'</div><div class="tv-meta">'+safe(r.date)+' · dataschema '+r.dataVersion+' · '+safe(r.label)+'</div><div class="tv-actions">'+(active?'<button disabled>Aktiv</button>':ok?'<button data-tv-run="'+safe(r.version)+'">Kör denna version</button>':'<button disabled>Restore blockerad · inkompatibelt dataschema</button>')+'</div></div>'}).join('');return '<div id="toolVersionModal"><div id="toolVersionCard"><button id="toolVersionClose">Stäng</button><h2>Verktygsversioner</h2><div class="tv-note">Byter endast verktygskod. Todos, backlog, development jobs och Dropbox-data ligger kvar. Äldre version kan bara köras när dess dataschema matchar aktuell data.</div>'+rows+'</div></div>'}function install(){if(document.getElementById('toolVersionButton'))return;document.body.insertAdjacentHTML('beforeend','<button id="toolVersionButton" title="Verktygsversioner">v'+safe(SELECTED)+'</button>'+modalHtml());const modal=document.getElementById('toolVersionModal');document.getElementById('toolVersionButton').onclick=()=>modal.classList.add('open');document.getElementById('toolVersionClose').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open');const b=e.target.closest('[data-tv-run]');if(!b)return;const r=RELEASES.find(x=>x.version===b.dataset.tvRun);if(!r||r.dataVersion!==dv())return;localStorage.setItem(PIN_KEY,r.version===SHELL_VERSION?'':r.version);if(r.version===SHELL_VERSION)localStorage.removeItem(PIN_KEY);location.href='./'+location.search+location.hash});if(SELECTED!==SHELL_VERSION){const bar=document.createElement('div');bar.id='toolVersionPinBanner';bar.style.cssText='position:fixed;z-index:100000;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#302e2a;color:#fff;padding:8px 11px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);font:12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';bar.innerHTML='Kör verktyg v'+safe(SELECTED)+' · data ligger kvar <button id="toolVersionLatest" style="border:0;border-radius:7px;padding:5px 8px;cursor:pointer">Återgå till senaste</button>';document.body.appendChild(bar);document.getElementById('toolVersionLatest').onclick=()=>{localStorage.removeItem(PIN_KEY);location.href='./'+location.search+location.hash}}}function patchHistory(){if(SELECTED!==SHELL_VERSION)return;const sub=document.getElementById('viewSub');if(sub&&/^App v4\\.2\\.1\\b/.test(sub.textContent))sub.textContent=sub.textContent.replace(/^App v4\.2\.1/,'App v4.3.0');const content=document.getElementById('content');if(!content||!document.getElementById('viewTitle')||document.getElementById('viewTitle').textContent!=='Backlog & historik')return;if(content.querySelector('[data-shell-history="4.3.0"]'))return;const h2=[...content.querySelectorAll('h2')].find(x=>x.textContent.trim()==='Versionshistorik');if(!h2)return;const item=document.createElement('div');item.className='version-item tool-version-history';item.dataset.shellHistory='4.3.0';item.innerHTML='<div class="item-title">v4.3.0 <span class="pill done">Current</span></div><div class="item-copy">2026-08-22 · Verktygssnapshots/restore utan att påverka todo- eller Dropbox-data. Core v4.2.1.</div>';h2.insertAdjacentElement('afterend',item);const next=item.nextElementSibling;if(next&&next.querySelector('.pill.done')){next.querySelector('.pill.done').textContent='Core'}}const observer=new MutationObserver(()=>patchHistory());observer.observe(document.documentElement,{subtree:true,childList:true,characterData:true});install();patchHistory();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();setTimeout(()=>{install();patchHistory()},0);})();<\/script>`}
function injectShell(html,selected){const style=shellCss(),script=versionUiScript(selected.version);return html.replace('</head>',style+'</head>').replace('</body>',script+'</body>')}
async function boot(){const selected=currentSelection();const status=document.getElementById('bootStatus');try{if(!selected)throw new Error(`Dataschema ${dataVersion()} är inte kompatibelt med verktyg v${SHELL_VERSION}. Ingen data har ändrats.`);status.textContent=`Startar Todo v${selected.version}…`;const res=await fetch(selected.path,{cache:'no-store'});if(!res.ok)throw new Error(`snapshot HTTP ${res.status}`);let html=await res.text();const expected=`const APP_VERSION="${selected.coreVersion}"`;if(!html.includes(expected)||!html.includes(`const DATA_VERSION=${selected.dataVersion};`))throw new Error('snapshot metadata mismatch');html=injectShell(html,selected);document.open();document.write(html);document.close()}catch(e){console.error(e);status.className='boot-card boot-error';status.innerHTML='<strong>Kunde inte starta vald verktygsversion.</strong><br>'+esc(e.message)+'<br><button id="resetToolVersion">Återställ till senaste</button>';document.getElementById('resetToolVersion').onclick=()=>{localStorage.removeItem(APP_PIN_KEY);location.reload()}}}
boot();
</script>
</body>
</html>
